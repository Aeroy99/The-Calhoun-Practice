name: PR Quality Gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Lint and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build
        env:
          # Public CMS origin; required by vite.config.ts for production builds.
          # Same value as documented in the root .env.example. Not a secret.
          VITE_PAYLOAD_URL: https://cms.thecalhounpractice.com
